[package]
name = "vpn-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
libc = "0.2"
serde_json = "1.0"
tracing.workspace = true
vpn-suite-core = { path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
wireguard-control = "1.7.1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
# Heavy tunnel deps are linux-only to keep Windows host checks fast
boringtun = "0.7.1"
tun = { version = "0.7.10" }
tun2proxy = "0.8.2"
tproxy-config = "7.0.7"

# Client tunnel engine dependencies land here phase-by-phase (see
# docs/LINUX_CLIENT_MICRO_PLAN.md) so every intermediate commit keeps
# `cargo check --target x86_64-unknown-linux-gnu` green on any host:
#   Block C/D: boringtun = "0.7.1", tun = "0.7.10" (workspace-patched)
#   Block E/F: tun2proxy = "0.8.2", tokio (workspace),
#              shadowsocks-service = { version = "1.24", features = ["local", "aead-cipher", "aead-cipher-2022"] }
