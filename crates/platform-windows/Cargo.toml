[package]
name = "vpn-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
boringtun = "0.7.1"
libloading = "0.8.6"
serde_json = "1.0"
tracing.workspace = true
tun = "0.7.10"
vpn-suite-core = { path = "../core" }

[target.'cfg(target_os = "windows")'.dependencies]
# Embedded Outline/Shadowsocks local client (no external sslocal.exe).
shadowsocks-service = { version = "1.24", default-features = false, features = [
    "local",
    "aead-cipher",
    "aead-cipher-2022",
] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
tun2proxy = "0.8.2"
wintun = "0.5.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
